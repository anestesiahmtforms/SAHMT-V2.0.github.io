# FC Worker created after authenticated inventory confirmed no existing Worker.
name = "sahmt-fc-integration"
main = "worker.js"
account_id = "57b8b02c577b6f61e96a61ce44142d2e"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "FC_ADMISSION"
class_name = "FcIntegrationAdmissionState"

[[migrations]]
tag = "fc-v1"
new_sqlite_classes = ["FcIntegrationAdmissionState"]

[vars]
FC_INTEGRATION_ENABLED = "false"
QMENTUM_WRITE_ENABLED = "false"
OCCURRENCE_SCORING_ENABLED = "false"
# No URL or secret is fabricated here. Set the verified dedicated Apps Script URL
# and per-pair HMAC secrets only in the destination service after live checks.
