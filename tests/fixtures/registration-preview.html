<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demonstração de cadastros</title><div id="app"></div><script type="module">
import '/src/styles.css';import {mountManagementHub} from '/src/management-hub.js';
import {announceRegistrationChange} from '/src/registration-refresh.js';
let record=null,valid=true,uploads=0;const params=new URL(location.href).searchParams;window.calls=[];
window.updateRegistration=next=>{record=next;announceRegistrationChange();};
const request=async(kind,action,input,signal)=>{
 window.calls.push({kind,action,input:structuredClone(input)});
 if(params.has('late')&&action==='BOOTSTRAP')await new Promise(resolve=>window.releaseLate=resolve);
 if(signal.aborted)throw Error('ABORTED');
 if(kind==='epidemiological'){
  if(action==='BOOTSTRAP')return {group:params.get('group')||'team',alreadyResponded:params.has('done'),canReadReport:true};
  if(action==='SUBMIT')return {accepted:true,alreadyResponded:false};
 }
 if(kind==='professional'){
  if(action==='BOOTSTRAP')return {record,profile:{email:'synthetic@example.invalid',displayName:'Pessoa Sintética',group:params.has('resident')?'resident':'team'},isAdmin:!params.has('resident'),
   ...(params.has('resident')?{invitationOnly:true,formVariant:'resident'}:{})};
  if(action==='SAVE'){
   if(params.has('legacyText')){
    const code=!input.answers.address?'REGISTRATION_INVALID_ADDRESS':!input.answers.teachingResearch?'REGISTRATION_INVALID_TEACHINGRESEARCH':null;
    if(code)throw Object.assign(Error(code),{code,status:400});
   }
   record={answers:input.answers,version:(record?.version||0)+1};return {record};
  }
 }
 if(kind==='drive'){
  if(action==='LIST_OWN')return {files:[]};
  if(action==='UPLOAD')return {file:{status:params.has('retry')&&++uploads===1?'PENDING':'STORED'}};
 }
 throw Error('UNKNOWN');
};
window.dispose=mountManagementHub(document.querySelector('#app'),{access:{surveys:true,professional:true,epidemiological:true,biosafety:true,institutionalSurveys:true,yearEndSchedule:true,vacations2027:true},initialPanel:'surveys',displayName:'Pessoa Sintética',climateEnabled:true,performRegistration:request,isSurveySessionCurrent:()=>valid,onExit(){window.dispose();}});window.invalidate=()=>{valid=false;window.dispose();};
</script></html>
