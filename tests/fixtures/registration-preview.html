<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demonstração de cadastros</title><div id="app"></div><script type="module">
import '/src/styles.css';import {mountManagementHub} from '/src/management-hub.js';
let record=null,valid=true;const params=new URL(location.href).searchParams;window.calls=[];
const request=async(kind,action,input,signal)=>{window.calls.push({kind,action,input:structuredClone(input)});if(params.has('late')&&action==='BOOTSTRAP')await new Promise(resolve=>window.releaseLate=resolve);if(signal.aborted)throw Error('ABORTED');if(kind==='epidemiological'){if(action==='BOOTSTRAP')return {group:params.get('group')||'team',alreadyResponded:params.has('done'),canReadReport:false};if(action==='SUBMIT')return {accepted:true,alreadyResponded:false};}if(kind==='professional'){if(action==='BOOTSTRAP')return {record,profile:{email:'synthetic@example.invalid',displayName:'Pessoa Sintética',group:'team'},isAdmin:false,drive:{connected:true,canConnect:false}};if(action==='SAVE'){record={answers:input.answers,version:1};return {record};}}if(kind==='drive'){if(action==='LIST_OWN')return {files:[],connected:true};if(action==='UPLOAD')return {file:{status:'STORED'}};}throw Error('UNKNOWN');};
window.dispose=mountManagementHub(document.querySelector('#app'),{access:{surveys:true},initialPanel:'surveys',displayName:'Pessoa Sintética',climateEnabled:true,performRegistration:request,isSurveySessionCurrent:()=>valid,onExit(){window.dispose();}});window.invalidate=()=>{valid=false;window.dispose();};
</script></html>
