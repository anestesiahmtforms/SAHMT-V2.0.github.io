<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font-family:system-ui}header{height:52px;background:#ddd}main{min-height:120vh}dialog{width:240px}</style>
<header>Aplicativo</header><main id="route"><button id="general">Área geral</button></main>
<dialog id="native"><button id="activity-control">Enviar atividade</button></dialog>
<script type="module">
import {mountCommunicationObligationBanner} from '../../src/communication-obligation-banner.js';
const day=86400000, published=1700000000000;
window.fixture={now:published,items:[{id:'old',title:'Convocação antiga',message:'Orientação de teste',publishAt:published,activity:{kind:'TRAINING',id:'training',title:'Treinamento seguro',version:1,minimumScore:7,maxScore:10}},{id:'new',title:'Convocação nova',publishAt:published+1000,activity:{kind:'SURVEY',id:'climate',title:'Pesquisa',cycle:'2026'}}],calls:[],completed:[],fail:false,current:true,opens:[],recoveries:0,signouts:0,general:0,submitted:0};
const f=window.fixture;
window.mount=()=>window.banner=mountCommunicationObligationBanner({uid:'synthetic-user',isCurrent:()=>f.current,client:{async request(action,input){f.calls.push({action,input});if(f.hold)await new Promise(resolve=>f.release=resolve);if(f.fail)throw Error('SOURCE_OFFLINE');return action==='PENDING_ACTIVITIES'?{items:f.items.filter(x=>!f.completed.includes(x.id)),serverNow:f.now}:{completed:f.completed.includes(input.id),serverNow:f.now,unavailable:f.unavailable,reason:f.unavailable?'Atividade retirada; solicite cancelamento ao administrador.':undefined};}},onOpenActivity:item=>{f.opens.push(item.id);window.banner.setActivityActive(item.id);document.querySelector('#native').showModal();},onRecover:async()=>{f.recoveries++;if(f.recoverDialog){const dialog=document.querySelector('#native');dialog.showModal();await new Promise(resolve=>{document.querySelector('#activity-control').onclick=()=>{f.submitted++;dialog.close();resolve();};});}f.fail=false;},onSignOut:()=>{f.signouts++;window.banner.cleanup();}});
document.querySelector('#general').onclick=()=>f.general++;
document.querySelector('#activity-control').onclick=()=>f.submitted++;
window.age=async hours=>{f.now=published+hours*day/24;await window.banner.refresh();};
window.mount();
</script></html>
