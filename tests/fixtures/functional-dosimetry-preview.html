<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;margin:0;padding:16px}#app{max-width:680px;margin:auto}</style><div id="app"></div><script type="module">
import '/src/functional-ui.css';import {mountFunctionalDosimetry}from'/src/functional-dosimetry.js';import{mountFunctionalDosimetryImport}from'/src/functional-dosimetry-import.js';
let valid=true;window.calls=[];const base={year:2026,issuedOn:'2026-11-15',sourceFingerprint:'b'.repeat(64),fileName:'relatorio.pdf',rows:[{code:'001',name:'Pessoa Um',values:['ANR','0,2',...Array(10).fill(null)],monitorType:'28'},{code:'002',name:'Pessoa Dois',values:['0,1',...Array(11).fill(null)],monitorType:'28'}]};
const request=async input=>{window.calls.push(input);if(input.operation==='PREVIEW_IMPORT')return {year:input.year,rows:input.rows.map((r,i)=>({...r,uid:i?'two':'one',expectedVersion:0,bindingConfirmed:false})),members:[{uid:'one',name:'Pessoa Um',version:0},{uid:'two',name:'Pessoa Dois',version:0}]};if(input.operation==='IMPORT')return {year:input.year,updated:input.rows.length,unchanged:0};return {uid:input.subjectUid,year:input.year,record:{uid:input.subjectUid,year:input.year,values:base.rows[0].values}};};
const root=document.querySelector('#app');window.dispose=new URL(location.href).searchParams.has('import')?mountFunctionalDosimetryImport(root,{request,isCurrent:()=>valid,readReport:async()=>structuredClone(base)}):mountFunctionalDosimetry(root,{subjectUid:'one',request,isCurrent:()=>valid,now:()=>new Date('2026-11-15T15:00:00Z')});window.invalidate=()=>{valid=false;window.dispose();};
</script></html>
