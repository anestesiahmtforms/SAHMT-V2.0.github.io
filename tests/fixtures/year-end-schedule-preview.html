<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia local · Escala Final de Ano · Dados sintéticos</title>
<style>body{background:#102d46;margin:0}#preview-tools{padding:8px 12px;color:white;font:12px system-ui}#preview-tools select{font:inherit;max-width:220px}#preview-tools label{display:inline}</style>
<div id="preview-tools">PRÉVIA LOCAL · DADOS SINTÉTICOS <label>Conta de exemplo <select id="preview-user"><option value="four">Pessoa de exemplo 04</option><option value="one">Pessoa de exemplo 01</option><option value="two">Pessoa de exemplo 02</option></select></label></div><div id="app"></div>
<script type="module">
import '/src/styles.css';
import {mountManagementHub} from '/src/management-hub.js';
import {validateYearEndChoices,yearEndParticipants} from '/src/year-end-schedule.js';
import {emptyYearEndTotals,changeYearEndTotals} from '/src/year-end-schedule-totals.js';
const rows=[{uid:'one',sigla:'AB',displayName:'NOME QUE NÃO PODE APARECER',plantao:'natal',grupo:'reveillon',position:1,createdAt:1793361600000},{uid:'two',sigla:'CD',plantao:'reveillon',grupo:'natal',position:2,createdAt:1793361660000},{uid:'three',sigla:'FR',plantao:'natal',grupo:null,position:3,createdAt:1793361720000}],listeners=new Set();
const participants=yearEndParticipants({schemaVersion:1,cycle:'2026-2027',siglasByUid:{one:'AB',two:'CD',three:'FR',four:'GH',exemptAD:'AD',exemptL2:'L2',exemptLE:'LE'}});
let generation=0,dispose=()=>{};
const params=new URL(location.href).searchParams;
function mount(){
  dispose();const ticket=++generation,selected=document.querySelector('#preview-user').value,uid=params.has('viewer')?'admin':selected;
  const name={four:'04',one:'01',two:'02'}[selected],sigla=params.get('sigla')||{four:'GH',one:'AB',two:'CD'}[selected];
  const requireGroup=!['FR','AD','L2','LE'].includes(sigla),isAdmin=params.has('admin'),canParticipate=!params.has('viewer');
  dispose=mountManagementHub(document.querySelector('#app'),{initialPanel:params.has('direct')?'yearEnd':'surveys',displayName:'PRÉVIA · Pessoa de exemplo '+name,access:{surveys:true,yearEndSchedule:true},isSurveySessionCurrent:()=>ticket===generation,onExit:()=>dispose(),
    createYearEndRepository:async current=>{
      const saveChoices=async(targetUid,input)=>{
        const person=participants.find(p=>p.uid===targetUid);if(!person)throw Object.assign(Error(),{code:'YEAR_END_INELIGIBLE'});
        validateYearEndChoices(input,person);await new Promise(r=>setTimeout(r,180));
        if(params.has('save-error'))throw Object.assign(Error('unavailable'),{code:'unavailable'});
        if(!current())throw Error('YEAR_END_SESSION_CHANGED');
        let row=rows.find(r=>r.uid===targetUid),updated=Boolean(row);
        if(row)Object.assign(row,input);else{row={uid:targetUid,sigla:person.sigla,...input,position:rows.length+1,createdAt:Date.now()};rows.push(row);}
        for(const notify of listeners)notify();return {...row,updated};
      };
      return {uid,
        open:async()=>{if(params.has('late'))await new Promise(r=>setTimeout(r,1500));if(params.has('resident')||params.has('substitute'))throw Object.assign(Error('YEAR_END_INELIGIBLE'),{code:'YEAR_END_INELIGIBLE'});return {sigla,requireGroup,isAdmin,canParticipate};},
        subscribe:cb=>{const notify=()=>cb({...(isAdmin?{rows:structuredClone(rows),participants:structuredClone(participants)}:{}),own:canParticipate?structuredClone(rows.find(r=>r.uid===uid)||null):null,totals:rows.reduce((totals,r)=>changeYearEndTotals(totals,null,r),emptyYearEndTotals()),fromCache:false});listeners.add(notify);notify();return()=>listeners.delete(notify);},
        save:input=>saveChoices(uid,input),
        saveFor:(targetUid,input)=>{if(!isAdmin)throw Object.assign(Error(),{code:'YEAR_END_ADMIN_REQUIRED'});return saveChoices(targetUid,input);}
      };
    }
  });
}
document.querySelector('#preview-user').addEventListener('change',mount);mount();
</script></html>
