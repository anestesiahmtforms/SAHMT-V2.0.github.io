<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escala de férias</title><div id="app"></div><script type="module">
import '/src/styles.css';import {mountManagementHub} from '/src/management-hub.js';import {vacationModel} from './vacations-2027-data.js';
const params=new URL(location.href).searchParams;window.calls=[];let data=vacationModel(params.has('admin'));if(params.has('unlinked'))data.ownSigla=null;
const request=async(action,input)=>{window.calls.push({action,input});if(params.has('late'))await new Promise(r=>window.releaseLate=r);if(action==='LOAD'||action==='REFRESH')return structuredClone(data);if(action==='AUDIT')return {rows:[{at:'2026',slot:'janeiro-0-0',sigla:'AA',justification:'Ajuste sintético',actor:'admin@example.invalid'}]};if(action==='UPDATE'){for(const c of input.changes)for(const m of data.months)for(const w of m.weeks)for(const s of w.slots)if(s.id===c.slotId)s.value=c.value;return {...structuredClone(data),saved:true};}throw Error('UNKNOWN');};
window.dispose=mountManagementHub(document.querySelector('#app'),{access:{vacations2027:!params.has('denied'),fePerformance:params.has('admin')},initialPanel:params.has('denied')?'vacations2027':'surveys',displayName:'Pessoa Sintética',performVacations:request,isSurveySessionCurrent:()=>true,onExit(){window.dispose();}});
</script></html>
