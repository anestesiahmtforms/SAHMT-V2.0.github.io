<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indicadores · demonstração sintética</title><style>body{margin:0;padding:20px;background:#e7eff1;font-family:Arial,sans-serif}#app{max-width:1400px;margin:auto}@media(max-width:600px){body{padding:8px}}</style><div id="app"></div><script type="module">
import {mountIndicatorsPlatform} from '/indicators-platform/ui.js';
const params=new URL(location.href).searchParams,year=2026;window.calls=[];let reviews=[],actions=[];
const sample=(id,platform,title,empty=false)=>({id,platform,title,description:'Acompanhar a execução do processo para orientar decisões institucionais.',unit:'%',direction:'MAXIMIZE',target:90,targetStatus:'PROPOSED',formula:'Registros concluídos / registros previstos × 100',source:'private_internal_collection',cadence:'MONTHLY',months:Array.from({length:12},(_,i)=>({month:i+1,period:'2026-'+String(i+1).padStart(2,'0'),status:empty?'NO_DATA':i<3||i===4?'VALID':i>9?'FUTURE':'NO_DATA',value:empty?null:i<3?[80,90,0][i]:i===4?85:null,numerator:empty?null:i<3?[16,18,0][i]:i===4?17:null,denominator:empty?null:20,analysis:'Leitura sintética do processo. Verificar a completude da coleta antes de interpretar o resultado.'})),quarters:Array.from({length:4},(_,i)=>({quarter:i+1,eligible:!empty&&i===0,status:!empty&&i===0?'VALID':'NO_DATA',reason:!empty&&i===0?'Três meses completos de observação.':'Aguardando três meses completos e válidos.',value:!empty&&i===0?56.7:null,proposal:!empty&&i===0?{title:'Conferir as barreiras do processo',evidence:'Três meses de observação sintética.',action:'Revisar a organização e as condições de execução do processo.',followUp:'Reavaliar mensalmente o indicador e registrar as mudanças.',requiresApproval:true}:null})),latest:null});
const metrics=[sample('mg-one','management','Conclusão das atividades'),sample('re-one','records','Completude dos registros',true),sample('su-one','surveys','Escuta institucional',true),sample('op-one','operations','Conferência da rotina',true)];metrics[2].cadence='CYCLE';metrics[2].latest={period:'Ciclo institucional 2026',status:'VALID',value:78.5,numerator:null,denominator:null,analysis:'Resultado agregado por ciclo, sem série mensal.'};
const data=()=>({schemaVersion:1,year,asOf:'2026-10-28',metrics,canManage:!params.has('readOnly'),connectionStatus:{management:{status:'READY'},records:{status:'READY'},surveys:{status:'READY'},operations:{status:'UNAVAILABLE'}},reviews,actions,methodology:['Esta é uma demonstração com dados sintéticos.','Nenhuma medida individual é exibida.']});
let live=true;const request=async(action,input,signal)=>{window.calls.push({action,input});if(params.has('late')&&action==='BOOTSTRAP')await new Promise(resolve=>window.releaseLate=resolve);if(signal.aborted)throw Error('Aborted');if(action==='BOOTSTRAP')return structuredClone(data());if(action==='REFRESH')return {updated:true};if(action==='SAVE_REVIEW'){const review={...input,version:input.expectedVersion+1};reviews=[review];return {review};}if(action==='SAVE_ACTION'){const action={...input,version:input.expectedVersion+1};actions=[action];return {action};}throw Error('UNKNOWN');};
window.dispose=mountIndicatorsPlatform(document.querySelector('#app'),{request,isCurrent:()=>live,onBack(){window.dispose();}});window.invalidate=()=>{live=false;window.dispose();};
</script></html>
