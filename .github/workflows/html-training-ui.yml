name: HTML training mobile experience
on:
  pull_request:
    branches: [main]
    paths: ['src/html-training*', 'src/styles.css', 'tests/html-training*', 'package*.json', '.github/workflows/html-training-ui.yml']
  push:
    branches: [main]
    paths: ['src/html-training*', 'src/styles.css', 'tests/html-training*', 'package*.json', '.github/workflows/html-training-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: training-ui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/html-training-ui.browser.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: html-training-mobile-preview
          path: .local-preview/html-training-*.png
          include-hidden-files: true
          if-no-files-found: ignore
