name: Build and deploy SAHMT V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.publication.outputs.app_version }}
      app_release: ${{ steps.publication.outputs.app_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Validate vaccination and private professional documents
        run: |
          npm run test:vaccination
          npm run test:dosimetry
          npm run test:biosafety-manual
          npm run test:registration
          npm run test:indicators-platform
          npm run build:indicators-platform
          npm run test:indicators-platform-rules
          npm run test:vaccination-rules
      - name: Validate authenticated survey participation and session bridge
        run: npm run test:survey-session
      - name: Validate year-end choices, ordering and FE access rules
        run: |
          npm run test:year-end
          npm run test:year-end-rules
      - name: Validate anonymous climate survey and free FE rules
        run: |
          npm run build:climate
          node --test tests/climate.test.js tests/climate-report.test.js tests/stress.test.js tests/stress-report.test.js
          npm run test:climate-rules
      - name: Run domain tests
        run: npm run test:domain
      - name: Verify targeted updates and device confirmation security
        run: |
          node --test tests/app-publication.test.js tests/app-updates-control-route.test.js tests/app-updates-targeted.test.js tests/app-updates-admin-lifecycle.test.js
          npx firebase emulators:exec --project demo-sahmt-v2 --only firestore "node --test tests/app-updates-targeted.rules.test.js"
      - name: Verify member categories and five-project identity classification
        run: node --test tests/member-categories.test.js
      # The executor quota guard is independent of Firestore authorization.
      - name: Verify Apps Script quota protection
        run: node --test tests/apps-script-service-quota.test.js
      - name: Verify authentication and module navigation lifecycle
        run: node --test tests/profile-server-reader.test.js tests/auth-server-profile.test.js tests/auth-profile-recovery.test.js tests/watch-session-recovery.test.js tests/connection-lifecycle.test.js tests/connection-main.test.js tests/fc-module-session.test.js tests/app-repair.test.js tests/app-updates.test.js tests/fa-runtime.test.js tests/management-entry-session.test.js tests/module-navigation.test.js tests/startup-banner.test.cjs tests/management-pilot.test.js
      - name: Run five-project Google authentication regression
        run: npm run test:google-project-auth
      - name: Verify independent FB data and rules contracts
        run: node --test tests/management-independent-fb.test.js
      - name: Verify independent FB Google access in local emulator
        run: npx firebase emulators:exec --project demo-sahmt-v2 --only firestore "node --test tests/management-independent-fb.rules.test.js"
      - name: Verify online-only operational policy
        run: npm run test:online-only
      - name: Run provisional operational channel tests
        run: npm run test:provisional-channel
      - name: Run remote continuity and reconciliation tests
        run: npm run test:remote-continuity
      - name: Run shared channel realtime tests
        run: npm run test:channel-realtime
      - name: Validate QMENTUM FC local package
        run: node scripts/build-qmentum-backend.mjs && npm run test:qmentum
      - name: Run legacy QMENTUM rules regression
        run: npm run test:qmentum-rules
      - name: Build FC module rules and test QMENTUM plus occurrences
        env:
          SAHMT_FIRESTORE_RULES_FILE: firestore.fc.rules
        run: |
          node --test tests/qmentum-fc-migration-verification.test.js tests/fc-source-retirement-rules.test.js
          npm run build:fc-module-rules
          npx firebase emulators:exec --config firebase.fc.test.json --project demo-sahmt-fc-modules --only firestore --non-interactive "node --test --test-force-exit --test-concurrency=1 tests/qmentum.rules.test.js tests/fc-occurrence.rules.test.js"
      - name: Run training repetition and continuation regression
        run: node --test tests/training-participation-state.test.js tests/forms-evaluation.test.js
      - name: Validate HTML training, privacy, scoring and ROP audits
        run: npm run test:html-training
      - name: Run management migration local tests
        run: npm run test:management
      - name: Verify FC module deployment targeting
        run: node --test tests/fc-module-deployment.test.js
      - name: Run FA consolidation safety tests
        run: node scripts/test-fa-consolidation.mjs
      - name: Run unified FA Occurrences unit tests
        run: node --test tests/occurrence-schema.test.js tests/occurrence-data.test.js tests/occurrence-ui.test.js tests/occurrence-fa-store.test.js tests/occurrence-fa-rules-builder.test.js tests/occurrence-worker-fa.test.js tests/evaluation-occurrence-delivery.test.js tests/occurrence-score-transport.test.js
      - name: Verify legacy FA Occurrences rules fixture
        run: npx firebase emulators:exec --config firebase.fa-consolidation.integration.test.json --project demo-sahmt-v2 --only firestore --non-interactive "node --test tests/occurrence-fa.rules.test.js"
      - name: Run management destination Rules tests
        run: npm run test:management-rules
      - name: Run Etiquetas AI Worker tests
        run: npm run test:label-ai-worker
      - name: Run operational spreadsheet delivery tests
        run: node --test tests/operational-sheet-control.test.js tests/operational-sheet-push.test.js tests/operational-sheet-delivery.test.js worker-management-auth/worker.test.js
      - name: Run Firestore Rules tests
        run: npm run test:rules
      - name: Run isolated evaluation transactions
        run: npm run test:evaluation-integration
      - name: Run isolated Checklist science transactions
        run: npm run test:checklist-integration
      - name: Run Cloud Functions Emulator tests
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: '60'
        run: npx firebase emulators:exec --project demo-sahmt-v2 --only auth,firestore,functions "npm --prefix functions test -- --test-concurrency=1"
      - name: Plan next published app version
        id: publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-app-publication.mjs
      - name: Build PWA
        env:
          VITE_CLIMATE_SURVEY_ENABLED: 'true'
          SAHMT_FB_CUTOVER: 'true'
          VITE_GOOGLE_PROJECT_AUTH_ENABLED: 'true'
          VITE_MANAGEMENT_FA_FIRST_LOGIN_ENABLED: 'false'
          VITE_MANAGEMENT_DATA_PROJECT: 'FA'
          VITE_EVALUATION_DATA_PROJECT: 'FA'
          VITE_OCCURRENCE_SCORING_ENABLED: ${{ vars.VITE_OCCURRENCE_SCORING_ENABLED }}
          VITE_MANAGEMENT_FIREBASE_ENABLED: 'false'
          VITE_INDICATORS_FIREBASE_ENABLED: 'true'
          VITE_FIREBASE_PROJECT_AUTH_ENABLED: 'false'
          VITE_FIREBASE_PROJECT_AUTH_AUTO_CONNECT_ENABLED: 'false'
          VITE_FIREBASE_PROJECT_AUTH_ALLOWED_ORIGIN: ${{ vars.VITE_FIREBASE_PROJECT_AUTH_ALLOWED_ORIGIN }}
          VITE_APP_CHECK_SITE_KEY: ${{ vars.VITE_APP_CHECK_SITE_KEY }}
          VITE_LABEL_AI_ENDPOINT: ${{ vars.VITE_LABEL_AI_ENDPOINT }}
          VITE_HTML_TRAINING_ENDPOINT: ${{ vars.VITE_HTML_TRAINING_ENDPOINT || 'https://sahmt-html-training.anestesiahmtforms.workers.dev/v1/training' }}
          VITE_LABEL_AI_ENABLED: ${{ vars.VITE_LABEL_AI_ENABLED }}
          VITE_OPERATIONAL_SHEETS_ENDPOINT: ${{ vars.VITE_OPERATIONAL_SHEETS_ENDPOINT }}
          VITE_OPERATIONAL_CHANNEL_ENDPOINT: ${{ vars.VITE_OPERATIONAL_CHANNEL_ENDPOINT }}
          VITE_OPERATIONAL_CONTINUITY_ENABLED: ${{ vars.VITE_OPERATIONAL_CONTINUITY_ENABLED }}
          VITE_OPERATIONAL_CHANNEL_REALTIME_ENABLED: ${{ vars.VITE_OPERATIONAL_CHANNEL_REALTIME_ENABLED || 'true' }}
        run: node scripts/build-independent-apps.mjs
      - name: Verify consolidated FA production dependencies
        run: node scripts/check-fa-runtime.mjs
      - name: Include local-only review tools
        run: mkdir -p dist/tools && cp tools/catalog-review.html dist/tools/catalog-review.html && cp tools/user-contact-review.html dist/tools/user-contact-review.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js for publication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Reject outdated publication artifacts before deploy
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          APP_RELEASE: ${{ needs.build.outputs.app_release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-app-publication.mjs
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-publication:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js for verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify published version before the next publication
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          APP_RELEASE: ${{ needs.build.outputs.app_release }}
        run: node scripts/verify-app-publication.mjs
